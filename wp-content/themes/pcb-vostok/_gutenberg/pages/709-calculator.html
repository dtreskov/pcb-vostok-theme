<!-- wp:group {"className":"calculator-field","layout":{"type":"constrained"}} -->
<div class="wp-block-group calculator-field"><!-- wp:html -->
<label>
    Количество плат, шт 
</label>

<input
    type="number"
    class="calculator-input"
    data-parameter="quantity"
    min="1"
    step="1"
    value="10">

<!-- /wp:group -->

<!-- wp:group {"className":"calculator-field","layout":{"type":"constrained"}} -->
<div class="wp-block-group calculator-field"><!-- wp:html -->
<label>

</label>

<select
    class="calculator-select"
    data-parameter="layers">

    <option value="2">2 слоя</option>
    <option value="4">4 слоя</option>
    <option value="6">6 слоёв</option>
    <option value="8">8 слоёв</option>
    <option value="10">10 слоёв</option>
    <option value="12">12 слоёв</option>
    <option value="16">16 слоёв</option>
    <option value="20">20 слоёв</option>
    <option value="24">24 слоя</option>

</select>
<!-- /wp:html --></div>
<!-- /wp:group -->

<!-- wp:group {"className":"calculator-field","layout":{"type":"constrained"}} -->
<div class="wp-block-group calculator-field"><!-- wp:html -->
<label>
    Размер платы, мм:
</label>

<div class="calculator-dimensions">
    <input
        type="number"
        class="calculator-input"
        data-parameter="length"
        min="10"
        step="0.1"
        max="2000"
        value="100"
    >

    <span>×</span>

    <input
        type="number"
        class="calculator-input"
        data-parameter="width"
        min="10"
        step="0.1"
        max="2000"
        value="100"
    >
</div>
<!-- /wp:html --></div>
<!-- /wp:group -->

<div class="wp-block-group calculator-field"><!-- wp:html -->

    Толщина платы: 
</label>

<select
    class="calculator-select"
    data-parameter="board_thickness">

    <option value="0.2">0.2 мм</option>

    <option value="0.6">0.6 мм</option>
    <option value="0.8">0.8 мм</option>

    <option value="1.6">1.6 мм</option>
    <option value="2.0">2.0 мм</option>
    <option value="2.4">2.4 мм</option>
    <option value="2.6">2.6 мм</option>
    <option value="2.8">2.8 мм</option>
    <option value="3.0">3.0 мм</option>
    <option value="3.2">3.2 мм</option>

</select>
<!-- /wp:html --></div>
<!-- /wp:group -->

<!-- wp:group {"className":"calculator-field","layout":{"type":"constrained"}} -->
<div class="wp-block-group calculator-field"><!-- wp:html -->
<label>
    Толщина фольги:
</label>

<select
    class="calculator-select"
    data-parameter="trace_thickness">

    <option value="18">18 мкм</option>
    <option value="35">35 мкм</option>
    <option value="50">50 мкм</option>
    <option value="70">70 мкм</option>
    <option value="105">105 мкм</option>

</select>

<div class="wp-block-group calculator-field"><!-- wp:html -->

    <option value="first">first (default)</option>
